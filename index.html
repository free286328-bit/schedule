/* v7: scroll confined to the schedule sheet; hide iOS scroll indicators */
html,body{width:100%;max-width:100%;overflow-x:clip}
body.modal-open{position:fixed;overflow:hidden;width:100%;left:0;right:0;touch-action:none}
.modalback{position:fixed;inset:0;inset-inline:0;width:100%;height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;touch-action:none;align-items:flex-end}
.modal{display:block;position:relative;flex:0 1 auto;width:100%;min-width:0;max-width:680px;max-height:calc(100dvh - env(safe-area-inset-top) - 12px);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none;overflow-wrap:anywhere}
.modal::-webkit-scrollbar,.modalback::-webkit-scrollbar{display:none;width:0;height:0}
.modal form,.modal .field,.modal .inline{max-width:100%;min-width:0}
.modal input,.modal select,.modal textarea{max-width:100%;min-width:0}
.subject-order{display:flex;align-items:center;gap:6px}
.subject-order button{min-width:36px;min-height:38px;padding:7px 10px}
.subject-name{flex:1;min-width:0;overflow-wrap:anywhere}
/* v8 subject drag handles */
.subject-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #ffffff12;min-height:61px;transition:background .12s,border-color .12s}
.subject-grip{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;flex:0 0 42px;height:42px;border:1px solid #ffffff25;border-radius:12px;background:#ffffff12;color:#d6c6ff;font-size:27px;cursor:grab;display:grid;place-items:center}
.subject-grip:active{cursor:grabbing}
.subject-item.drag-active{background:#a98bed20;border-radius:12px;opacity:.7}
.subject-item.drag-target{box-shadow:inset 0 3px 0 #cbb1ff;background:#ffffff0c;border-radius:12px}
.subject-dragging{user-select:none;-webkit-user-select:none}

/* v9: constrain native iOS date/time fields to the sheet width */
.modal,.modal form,.modal .field,.modal .inline{box-sizing:border-box;min-width:0;max-width:100%}
.modal .field{width:100%;overflow-x:clip}
.modal .inline{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);width:100%;gap:10px}
.modal .inline>.field{width:100%;min-width:0;overflow-x:clip}
.modal input[type="date"],.modal input[type="time"]{display:block;box-sizing:border-box;width:100%;min-width:0;max-width:100%;overflow:hidden;-webkit-appearance:none;appearance:none;font-size:16px;text-align:left}
.modal input[type="date"]::-webkit-date-and-time-value,.modal input[type="time"]::-webkit-date-and-time-value{min-width:0;max-width:100%;text-align:left}
.modal input[type="date"]::-webkit-datetime-edit,.modal input[type="time"]::-webkit-datetime-edit{min-width:0;max-width:100%;padding:0;white-space:nowrap}
/* v9: keep the six-dot drag grip, remove its surrounding box */
.subject-grip{border:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;flex-basis:32px;width:32px;height:42px;padding:0;color:#cbb9f5}

/* Lunary v10: hide scrollbar indicators while retaining native scrolling */
html,body,body *,body *::before,body *::after{scrollbar-width:none!important;-ms-overflow-style:none!important}
html::-webkit-scrollbar,body::-webkit-scrollbar,body *::-webkit-scrollbar{display:none!important;width:0!important;height:0!important;background:transparent!important}

/* v12: match the original compact field dimensions, including empty iOS time inputs. */
.modal .inline { grid-template-columns:repeat(2,minmax(0,1fr)); align-items:start; }
.modal .inline > .field { min-width:0; width:100%; overflow:visible; }
.modal .inline input[type="time"] {
  display:block; width:100%; min-width:0; max-width:100%;

  display:block; width:100%; min-width:0; min-height:24px;
  height:24px; line-height:24px; text-align:left;
}
.modal .inline input[type="time"]::-webkit-datetime-edit {
  display:block; min-width:0; padding:0; white-space:nowrap;
}
